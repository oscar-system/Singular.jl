name: CI with Singular

on:
  push:
    branches:
      - 'master'
      - 'release-*'
    tags: '*'
  pull_request:
  schedule:
      # Every day at 2:33 AM UTC
      - cron: '33 2 * * *'
  workflow_dispatch:

concurrency:
  # group by workflow and ref; the last slightly strange component ensures that for pull
  # requests, we limit to 1 concurrent job, but for the default repository branch we don't
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref_name != github.event.repository.default_branch || github.run_number }}
  # Cancel intermediate builds, but only if it is a pull request build.
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    name: Julia ${{ matrix.julia-version }} - Singular ${{ matrix.singular-version }} - ${{ matrix.os }}${{ matrix.omalloc-config != 'host-pagesize' && format(' - {0}', matrix.omalloc-config) || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    continue-on-error: ${{ matrix.julia-version == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        singular-version:
          - 'spielwiese'
        julia-version:
          - '1'         # latest stable release
        #  - '1.13-nightly' # TODO: enable once julia 1.13.0-rc1 is released
          - 'nightly'
        os:
          - ubuntu-latest
        omalloc-config:
          - 'host-pagesize'
        include:
          # Match the current macOS ARM JLL ABI.
          - singular-version: 'spielwiese'
            julia-version: '1'
            os: macOS-latest
            omalloc-config: 'jll-4k'
          # Also exercise the intermediate supported omalloc page size.
          - singular-version: 'spielwiese'
            julia-version: '1'
            os: macOS-latest
            omalloc-config: 'omalloc-8k'
          # Also exercise a fully native macOS ARM stack.
          - singular-version: 'spielwiese'
            julia-version: '1'
            os: macOS-latest
            omalloc-config: 'native-16k'

    steps:
      - uses: actions/checkout@v7
      - name: "Set up Julia"
        uses: julia-actions/setup-julia@v3
        id: setup-julia
        with:
          version: ${{ matrix.julia-version }}
      - name: "Checkout Singular"
        uses: actions/checkout@v7
        with:
          repository: 'Singular/Singular'
          ref: ${{ matrix.singular-version }}
          path: 'SINGULARROOT'
      - name: "Install dependencies (for macOS)"
        if: runner.os == 'macOS'
        run: |
          brew install autoconf automake libtool
      - name: "Select omalloc page size"
        if: matrix.omalloc-config != 'host-pagesize'
        run: |
          case "${{ matrix.omalloc-config }}" in
            jll-4k)
              echo "ac_cv_pagesize=4096" >> "$GITHUB_ENV"
              ;;
            omalloc-8k)
              echo "ac_cv_pagesize=8192" >> "$GITHUB_ENV"
              ;;
            native-16k)
              if [[ "$(getconf PAGESIZE)" != "16384" ]]; then
                echo "native-16k requires a host with 16 KiB pages" >&2
                exit 1
              fi
              echo "ac_cv_pagesize=16384" >> "$GITHUB_ENV"
              ;;
            *)
              echo "unknown omalloc configuration: ${{ matrix.omalloc-config }}" >&2
              exit 1
              ;;
          esac
      - name: "Run autogen.sh in SINGULARROOT"
        run: |
          mv SINGULARROOT /tmp/SINGULARROOT
          cd /tmp/SINGULARROOT
          ./autogen.sh
      - name: "Override bundled Singular"
        run: |
          julia --proj=override etc/setup_override_dir.jl /tmp/SINGULARROOT /tmp/singular_jll_override
      - name: "Verify omalloc page size"
        if: matrix.omalloc-config != 'host-pagesize'
        run: |
          case "${{ matrix.omalloc-config }}" in
            jll-4k) expected=4096 ;;
            omalloc-8k) expected=8192 ;;
            native-16k) expected=16384 ;;
          esac
          grep -F "#define SIZEOF_SYSTEM_PAGE $expected" /tmp/singular_jll_override/include/omalloc/omConfig.h
      - name: "Run tests"
        run: |
           julia --proj=override etc/run_with_override.jl /tmp/singular_jll_override --depwarn=error -e "using Pkg; Pkg.test(\"Singular\")"

